name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  android-ci:
    name: Lint, Unit Tests & Instrumented Tests
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # Step 1: Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # Step 3: Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2

      # Step 4: Gradle permissions
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # Step 5: Run Lint
      - name: Run Lint
        run: ./gradlew lint

      # Step 6: Run JVM Unit Tests (no emulator)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Step 7: Launch emulator & run Instrumented Tests (ONNX etc.)
      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedAndroidTest
