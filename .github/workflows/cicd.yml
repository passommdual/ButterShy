name: Android CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  android-ci:
    name: Lint, Unit Tests & Instrumented Tests
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: 33.0.2

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run Lint
        run: ./gradlew lint

      # Run JVM Unit Tests (no emulator)
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # Launch emulator & run Instrumented Tests (ONNX etc.)
      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: "-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect"
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace --info

      - name: Pull test results from emulator
        run: |
          adb wait-for-device
          echo "Listing cache directory:"
          adb shell "ls /data/data/com.example.butterflydetector/cache"
          adb pull /data/data/com.example.butterflydetector/cache/butterfly_positive_results.txt ./butterfly_positive_results.txt || echo "Positive results file not found"
          adb pull /data/data/com.example.butterflydetector/cache/butterfly_negative_results.txt ./butterfly_negative_results.txt || echo "Negative results file not found"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-test-results
          path: |
            ./butterfly_positive_results.txt
            ./butterfly_negative_results.txt
